name: PR02 — пакет, запуск и evidence

on: [push, pull_request]

jobs:
  pr02-build:
    name: PR02 — сборка turtle_bringup
    runs-on: ubuntu-latest
    container:
      image: ros:lyrical
    timeout-minutes: 15
    env:
      COURSE_KIT_URL: https://ros.lms.ci.nsu.ru/downloads/robotics-course-kit-v1-w08-aea8efd0a516.tar.gz
      COURSE_KIT_SHA256: aea8efd0a51668af63f2e475b82bfa28bd76c21f20d8afea6b136d43a56a88fb
    steps:
      - name: Получить всю историю коммитов
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Собрать PR02
        shell: bash
        run: |
          source /opt/ros/lyrical/setup.bash
          colcon build --symlink-install --packages-select turtle_bringup
          source install/setup.bash
          test -f "$(ros2 pkg prefix turtle_bringup)/share/turtle_bringup/launch/sim.launch.py"
          python3 -m py_compile src/turtle_bringup/launch/sim.launch.py
      - name: Скачать зафиксированный комплект курса
        shell: bash
        run: |
          curl -fsSLo /tmp/course-kit.tar.gz "$COURSE_KIT_URL"
          printf '%s  %s\n' "$COURSE_KIT_SHA256" /tmp/course-kit.tar.gz | sha256sum -c -
          mkdir -p .course-kit
          tar -xzf /tmp/course-kit.tar.gz -C .course-kit
      - name: Проверить комплектность evidence PR02
        shell: bash
        run: python3 .course-kit/v1/tools/check_practice.py PR02 --submission .